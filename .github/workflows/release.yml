name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix web
      - run: npx --yes @tauri-apps/cli@2.11.4 build --no-bundle
      - run: gh release create "${{ github.ref_name }}" --draft --generate-notes target/release/fm-squad-planner-desktop.exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
