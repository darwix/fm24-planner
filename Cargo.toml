[package]
name = "fm-savelens-backend"
version = "1.4.0"
edition = "2021"
publish = false
description = "Read-only Football Manager 2024 save database"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fm-savelens-24-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs2 = "0.4"
open = "5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# Snapshot timestamps must survive JSON deserialization without rounding.
serde_json = { version = "1", features = ["float_roundtrip"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

[profile.release]
lto = "thin"
strip = "debuginfo"
