<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A · Tactical board</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--ink:#1d2320;--mut:#7b7a70;--card:#fbf8f1;--line:#e2dccd;--acc:#1f6f4a;--warn:#b5651d;--bad:#b23a2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Geist,system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden}
header{display:flex;align-items:baseline;gap:16px;padding:22px 40px}
h1{font:700 30px Fraunces,serif;margin:0;letter-spacing:-.02em}header span{color:var(--mut)}
header .r{margin-left:auto;display:flex;gap:10px}
.btn{font:500 13px Geist;border:0;background:none;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s}
.btn:hover{background:#0001}.btn:active{transform:scale(.97)}.btn.pri{background:var(--ink);color:var(--bg)}.btn.pri:hover{background:#000}
.btn.del{color:var(--bad)}
.wrap{display:grid;grid-template-columns:minmax(420px,560px) 1fr;gap:48px;padding:0 40px 40px;max-width:1400px;margin:auto}
.pitch{position:relative;aspect-ratio:3/4;border-radius:18px;background:#e7e2d3;box-shadow:inset 0 0 0 1px var(--line)}
.pitch:before{content:"";position:absolute;inset:6%;border:1.5px solid #c9c2ad;border-radius:6px}
.pitch:after{content:"";position:absolute;left:6%;right:6%;top:50%;border-top:1.5px solid #c9c2ad}
.pl{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;width:90px;z-index:1}
.pl i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 4px;border-radius:14px;font:600 15px Geist;font-style:normal;background:var(--card);box-shadow:0 2px 0 var(--line),0 6px 14px #3a301422;transition:.15s}
.pl:hover i{transform:translateY(-3px)}.pl.sel i{background:var(--ink);color:var(--bg)}.pl.bad i{box-shadow:inset 0 0 0 2px var(--bad),0 6px 14px #3a301422}
.pl small{font-size:11px;font-weight:500}.pl em{display:block;font-style:normal;font-size:10px;color:var(--mut)}
h2{font:700 20px Fraunces,serif;margin:0 0 4px}.sub{color:var(--mut);margin-bottom:16px}
.list{display:grid;gap:4px}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.15s}.row:hover{background:var(--card)}
.row.sel{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.row b{font-weight:600}.row .p{color:var(--mut);font-size:11px;width:28px}.row .ca{margin-left:auto;font-weight:600}
.bn{margin:28px 0 8px;font-size:12px;color:var(--mut);letter-spacing:.04em}
nav{display:flex;gap:4px;margin-left:24px}nav button{font:500 14px Geist;border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s}nav button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.wrap2{display:grid;grid-template-columns:320px 1fr;gap:48px;padding:0 40px 40px;max-width:1400px;margin:auto}.wrap[hidden],.wrap2[hidden]{display:none}
.tc{background:var(--card);border-radius:18px;padding:22px;box-shadow:inset 0 0 0 1px var(--line);position:sticky;top:16px;align-self:start}
.tc .big{font:700 52px/1 Fraunces,serif}.tc h2{margin:10px 0 2px}
.at{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:16px 0}.at div{font-size:11px;color:var(--mut)}.at b{display:block;font-size:16px;color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}.chip{padding:6px 12px;border-radius:8px;background:#0000000a;color:var(--mut);cursor:pointer;font-weight:500;transition:.15s}.chip.on{background:var(--ink);color:var(--bg)}
.cand{padding:18px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center}
.m{font:700 30px Fraunces,serif;color:var(--acc)}
.cand h3{margin:0;font-size:16px}.cand p{margin:2px 0 8px;color:var(--mut);font-size:12px}
.tg{display:inline-block;font-size:11px;font-weight:600;margin-right:10px}.tg.exp{color:var(--warn)}.tg.list{color:#2b5fa8}.tg.cheap{color:var(--acc)}
.dl{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--mut)}.dl span b{color:var(--ink);font-weight:600;margin:0 3px}
.up{color:var(--acc)}.dn{color:var(--bad)}.eq{color:var(--mut)}
.sort{margin-left:auto;color:var(--mut);font-size:12px}
header{position:sticky;top:0;z-index:5;padding:0 40px;margin-bottom:28px;background:#f3efe6ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);align-items:center}
header h1{font-size:22px;padding:16px 0}
nav{margin-left:40px;align-self:stretch;gap:24px}
nav button{border-radius:0;padding:0 2px;box-shadow:none!important;background:none!important;border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}nav button:hover{color:var(--ink)}
nav em{font-style:normal;font-size:11px;background:var(--ink);color:var(--bg);border-radius:99px;padding:1px 7px;margin-left:4px}
.wrap2.sc{grid-template-columns:260px 1fr}
.ls{display:grid;gap:4px;margin-top:10px}.li{padding:10px 12px;border-radius:12px;cursor:pointer;transition:.15s;display:flex;gap:8px;align-items:center}.li:hover{background:var(--card)}.li.sel{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.li small{margin-left:auto;color:var(--mut)}.li .x{color:var(--mut);margin-left:6px}.li .x:hover{color:var(--bad)}
.cr{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:16px;margin:12px 0 18px}
.cr label{font-size:11px;color:var(--mut);display:grid;gap:4px}.cr select,.cr input[type=number],.cr input[type=text]{font:500 13px Geist;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff8;color:var(--ink)}
.cr input[type=number]{width:64px}.cr .ck{display:flex;gap:6px;align-items:center;padding-bottom:8px;font-size:13px;color:var(--ink)}
.tb{width:100%;border-collapse:collapse}.tb th{text-align:left;font-size:11px;color:var(--mut);font-weight:500;padding:6px 8px}.tb td{padding:11px 8px;border-top:1px solid var(--line)}
.tb th.r,.tb td.r{text-align:right}.tb td.pa{font:700 17px Fraunces,serif;color:var(--acc)}
.tb tr.cl{cursor:pointer;transition:background .12s}.tb tr.cl:hover{background:var(--card)}
.pd{max-width:1100px;margin:auto;padding:0 40px 60px}.pd[hidden]{display:none}
.pd .top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:8px 0 24px;border-bottom:1px solid var(--line)}
.pd h2{font-size:42px;letter-spacing:-.02em;margin:6px 0}.pd .big{font:700 64px/1 Fraunces,serif;color:var(--acc);text-align:right}.pd .big small{display:block;font:500 11px Geist;color:var(--mut);margin-top:4px}
.fx{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:22px 0}.fx div{font-size:11px;color:var(--mut)}.fx b{display:block;font-size:18px;color:var(--ink);font-weight:600;margin-top:2px}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:8px}.ag h3{font-size:12px;letter-spacing:.06em;color:var(--mut);font-weight:500;margin:0 0 8px}
.ar{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}.ar b{font-weight:600;padding:0 8px;border-radius:6px}
.v-hi{background:#1f6f4a22;color:var(--acc)}.v-mid{background:#b5651d22;color:var(--warn)}
.cv{margin-left:6px;font-weight:600;color:var(--acc)}.cv.lo{color:var(--warn)}.row.ad{border:1.5px dashed var(--line);color:var(--mut);justify-content:center;font-weight:500}.row.ad:hover{border-color:var(--ink);color:var(--ink)}
.wrap.solo{grid-template-columns:minmax(420px,560px);justify-content:center}
.upl{max-width:640px;margin:48px auto;padding:0 24px}.upl[hidden]{display:none}
.dz{border:2px dashed #c9c2ad;border-radius:20px;padding:56px 24px;text-align:center;cursor:pointer;transition:.15s;display:block}
.dz:hover,.dz.over{border-color:var(--ink);background:var(--card)}.dz b{font:700 22px Fraunces,serif;display:block;margin-bottom:6px}.dz span{color:var(--mut)}
.err{color:var(--bad);margin-top:12px;font-weight:500}
.fi{display:flex;justify-content:space-between;padding:14px 16px;background:var(--card);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:20px}.fi span{color:var(--mut)}
.stp{display:grid;gap:10px}.stp div{display:flex;gap:12px;align-items:center;color:var(--mut)}.stp i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-style:normal;font-size:11px}
.stp .on{color:var(--ink);font-weight:600}.stp .on i{background:var(--ink);color:var(--bg);animation:pu 1s infinite}.stp .done{color:var(--ink)}.stp .done i{background:var(--acc);color:#fff;box-shadow:none}
@keyframes pu{50%{opacity:.5}}
.pb{height:4px;background:#0000000f;border-radius:4px;margin:20px 0;overflow:hidden}.pb i{display:block;height:100%;background:var(--acc);transition:width .6s}
.sm{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0 24px}.sm div{font-size:11px;color:var(--mut)}.sm b{display:block;font:700 26px Fraunces,serif;color:var(--ink)}
</style></head><body>
<header><h1>Meong Racun</h1><span>2052 · save v03</span><nav><button id="n-squad" class="on" onclick="go('squad')">Squad</button><button id="n-short" onclick="addPos=null;go('short')">Shortlist <em id="cn"></em></button><button id="n-scout" onclick="go('scout')">Scouting</button></nav><button class="btn" style="margin-left:auto" onclick="go('upload')">Load save</button></header>
<div class="wrap" id="squad">
 <div><div class="pitch" id="pitch"></div></div>
 <div id="rt" hidden><div style="display:flex;align-items:start"><div><h2>Position depth</h2><div class="sub">Starter and cover</div></div><button class="btn" style="margin-left:auto" onclick="open_=false;r()">Close</button></div><div id="grp"></div></div>
</div>
<section class="wrap2" id="short" hidden></section>
<section class="wrap2 sc" id="scout" hidden></section>
<section class="pd" id="player" hidden></section>
<section class="upl" id="upload" hidden></section>
<script src="data.js"></script>
<script>
let sel=3,open_=false;
const row=(s,i)=>`<div class="row ${i===sel?'sel':''}" onclick="sel=${i};r()"><span class="p">${s.p}</span><b>${s.n}</b><span class="ca">${s.ca}</span>${i===sel?`<button class="btn" onclick="event.stopPropagation();addPos=null;go('short')">Find replacement</button><button class="btn del" onclick="event.stopPropagation();rm()">Remove</button>`:''}</div>`;
function r(){$('#rt').hidden=!open_;$('#squad').classList.toggle('solo',!open_);
 $('#pitch').innerHTML=squad.map((s,i)=>s.xi?`<div class="pl ${i===sel?'sel':''} ${s.c<=2052?'bad':''}" style="left:${s.x}%;top:${s.y}%" onclick="sel=${i};open_=true;r()"><i>${s.ca}</i><small>${s.n.split(' ').pop()}</small><em>${s.p}</em></div>`:'').join('');
 $('#grp').innerHTML=[["Goalkeeper",["GK"]],["Right back",["DR"]],["Centre back",["DC"]],["Left back",["DL"]],["Defensive mid",["DM"]],["Attacking mid",["AM"]],["Right wing",["AMR"]],["Left wing",["AML"]],["Striker",["ST"]]].filter(([g,ps])=>ps.includes(squad[sel]?.p)).map(([g,ps])=>{
  const rows=squad.map((s,i)=>[s,i]).filter(([s])=>ps.includes(s.p)).sort((a,b)=>ps.indexOf(a[0].p)-ps.indexOf(b[0].p)||b[0].ca-a[0].ca);
  const T={GK:2,DR:2,DC:4,DL:2,DM:2,AM:2,AMR:2,AML:2,ST:2}[ps[0]],need=Math.max(0,T-rows.length);
  return `<div class="bn">${g.toUpperCase()} <span class="cv ${need?'lo':''}">${Math.min(rows.length,T)}/${T}</span></div><div class="list">${rows.map(([s,i])=>row(s,i)).join('')}${Array.from({length:need},()=>`<div class="row ad" onclick="findPos('${ps[0]}')">+ Add cover · ${ps[0]}</div>`).join('')}</div>`}).join('');
}
let on=['exp','list','cheap'];
function go(p){$('#cn').textContent=cands.length;if(location.hash!=='#/'+p){location.hash='/'+p;return}
 for(const k of['squad','short','scout','player','upload']){$('#'+k).hidden=p!==k;$('#n-'+k)?.classList.toggle('on',p===k||(k==='scout'&&p==='player'))}
 if(p==='short')shortlist();if(p==='scout')scout();if(p==='player')detail();if(p==='upload')upView()}
function shortlist(){const add=!!addPos,t=squad[sel],K=add?[]:Object.keys(t.at),src=add?(addPos==='DC'?cands:pool.filter(p=>p.p===addPos).map(p=>({...p,m:Math.min(99,Math.round((p.ca*.6+p.pa*.4)/1.6)),tags:[...(p.left<=12?['exp']:[]),...(p.v<=5?['cheap']:[])]}))):cands,L=src.filter(c=>c.tags.some(g=>on.includes(g)));
 $('#short').innerHTML=`${add?`<div class="tc"><div class="sub" style="margin:0">ADDING COVER</div><h2>${addPos}</h2><div class="sub">${squad.filter(s=>s.p===addPos).length} in squad</div><button class="btn" onclick="addPos=null;go('squad')">← Back to squad</button></div>`:''}<div class="tc" ${add?'hidden':''}><div class="sub" style="margin:0">REPLACING</div><h2>${t.n}</h2><div class="sub" style="margin:0">${t.p} · ${t.a}y · contract ${t.c}</div>
 <div class="big" style="margin-top:14px">${t.ca}</div><div class="sub">CA · PA ${t.pa} · €${t.w}k/wk</div>
 <div class="at">${K.map(k=>`<div>${k}<b>${t.at[k]}</b></div>`).join('')}</div><button class="btn" onclick="go('squad')">← Back to squad</button></div>
 <div><h2>Shortlist</h2><div class="sub">Ranked by profile match · ${L.length} players</div>
 <div class="chips">${Object.keys(TAG).map(k=>`<span class="chip ${on.includes(k)?'on':''}" onclick="tg('${k}')">${TAG[k]}</span>`).join('')}</div>
 ${L.map(c=>`<div class="cand"><div class="m">${c.m}</div><div><h3>${c.n} <span style="color:var(--mut);font-weight:400">· ${c.cl}</span></h3>
 <p>${c.p} · ${c.a}y · CA ${c.ca}/${c.pa} · ${c.left<=12?c.left+' months left':'to '+(c.c||2052+Math.ceil(c.left/12))} · ${money(c.v)} · €${c.w}k/wk</p>${c.tags.map(g=>`<span class="tg ${g}">${TAG[g]}</span>`).join('')}
 <div class="dl">${K.map(k=>`<span>${k}<b>${c.at[k]}</b>${d(c.at[k],t.at[k])}</span>`).join('')}</div></div>
 <button class="btn pri" onclick="${add?'addC':'swap'}('${c.n}')">${add?'Add to squad':'Swap in'}</button></div>`).join('')||'<div class="sub">No matches. Turn a filter back on.</div>'}</div>`}
const LISTS=[{name:"Promising youngsters",f:{pos:"",min:18,max:23,exp:false,val:""},sort:"pa",fixed:1},{name:"Contract expiring",f:{pos:"",min:16,max:45,exp:true,val:""},fixed:1}];
let li=0;
const cnt=f=>pool.filter(p=>match(p,f)).length;
function match(p,f){return(!f.pos||p.p===f.pos)&&p.a>=f.min&&p.a<=f.max&&(!f.exp||p.left<=12)&&(!f.val||p.v<=f.val)}
function scout(){const L=LISTS[li],f=L.f,ps=[...new Set(pool.map(p=>p.p))];
 const rows=pool.filter(p=>match(p,f)).sort((a,b)=>b.pa-a.pa);
 $('#scout').innerHTML=`<div><h2>Lists</h2><div class="sub">Saved scouting searches</div><div class="ls">${LISTS.map((l,i)=>`<div class="li ${i===li?'sel':''}" onclick="li=${i};scout()">${l.name}<small>${cnt(l.f)}</small>${l.fixed?'':`<span class="x" onclick="event.stopPropagation();LISTS.splice(${i},1);li=0;scout()">✕</span>`}</div>`).join('')}</div>
 <button class="btn" style="margin-top:10px" onclick="LISTS.push({name:'New list',f:{pos:'',min:16,max:40,exp:false,val:''}});li=LISTS.length-1;scout()">+ New list</button></div>
 <div><h2>${L.fixed?L.name:`<input type=text value="${L.name}" onchange="L_=LISTS[li].name=this.value;scout()" style="font:700 20px Fraunces,serif;border:0;background:none;width:100%">`}</h2><div class="sub">${rows.length} players · ranked by potential${L.fixed?' · preset':''}</div>
 <div class="cr">
  <label>Position<select onchange="LISTS[li].f.pos=this.value;scout()"><option value="">Any</option>${ps.map(x=>`<option ${f.pos===x?'selected':''}>${x}</option>`).join('')}</select></label>
  <label>Age<span><input type=number value="${f.min}" onchange="LISTS[li].f.min=+this.value;scout()"> – <input type=number value="${f.max}" onchange="LISTS[li].f.max=+this.value;scout()"></span></label>
  <label>Max value (€M)<input type=number value="${f.val}" placeholder="any" onchange="LISTS[li].f.val=+this.value;scout()"></label>
  <label class="ck"><input type=checkbox ${f.exp?'checked':''} onchange="LISTS[li].f.exp=this.checked;scout()"> Contract expiring (≤12m)</label></div>
 <table class="tb"><thead><tr><th>PA</th><th>Name</th><th>Pos</th><th>Age</th><th>From</th><th>CA</th><th>Contract</th><th class="r">Value</th><th class="r">Wage</th><th></th></tr></thead><tbody>
 ${rows.map(p=>`<tr class="cl" onclick="openP('${p.n}')"><td class="pa">${p.pa}</td><td><b>${p.n}</b><br><span style="color:var(--mut);font-size:12px">${p.cl}</span></td><td>${p.p}</td><td>${p.a}</td><td>${p.nat}</td><td>${p.ca}</td>
 <td style="${p.left<=12?'color:var(--warn);font-weight:600':''}">${p.left} months</td><td class="r">${money(p.v)}</td><td class="r">€${p.w}k</td><td class="r"><button class="btn" onclick="event.stopPropagation();addP('${p.n}')">+ Add</button></td></tr>`).join('')||'<tr><td colspan=10 class="sub" style="padding:24px">No players match.</td></tr>'}</tbody></table></div>`}
let pl=null;
let addPos=null;
const findPos=p=>{addPos=p;go('short')};
const addC=n=>{const c=[...cands,...pool].find(x=>x.n===n);squad.push({n:c.n,p:addPos,a:c.a,ca:c.ca,pa:c.pa,c:c.c||2052+Math.ceil(c.left/12),v:c.v,w:c.w,at:squad[0].at});addPos=null;go('squad');r()};
const openP=n=>{pl=n;go('player')};
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const GROUPS={Technical:["Crossing","Dribbling","Finishing","First touch","Heading","Marking","Passing","Tackling","Technique"],Mental:["Anticipation","Composure","Decisions","Determination","Positioning","Teamwork","Vision","Work rate"],Physical:["Acceleration","Agility","Balance","Jumping","Pace","Stamina","Strength"]};
const attr=(p,a)=>Math.max(3,Math.min(20,Math.round(p.ca/9.5+((hash(p.n+a)%7)-3)*.9)));
function detail(){const p=pool.find(x=>x.n===pl);if(!p)return go('scout');
 $('#player').innerHTML=`<a class="btn" style="margin:0 -14px" onclick="history.back()">← Back to scouting</a>
 <div class="top"><div><div class="sub" style="margin:0">${p.cl} · ${p.nat}</div><h2>${p.n}</h2><div class="sub" style="margin:0">${p.p} · ${p.a} years</div></div>
 <div class="big">${p.pa}<small>POTENTIAL · CA ${p.ca}</small></div></div>
 <div class="fx"><div>Contract<b style="${p.left<=12?'color:var(--warn)':''}">${p.left} months left</b></div><div>Value<b>${money(p.v)}</b></div><div>Wage<b>€${p.w}k/wk</b></div><div>Age<b>${p.a}</b></div><div>Growth room<b>+${p.pa-p.ca} CA</b></div></div>
 <div class="ag">${Object.entries(GROUPS).map(([g,l])=>`<div><h3>${g.toUpperCase()}</h3>${l.map(a=>{const v=attr(p,a);return `<div class="ar"><span>${a}</span><b class="${v>=14?'v-hi':v>=11?'v-mid':''}">${v}</b></div>`}).join('')}</div>`).join('')}</div>
 <div style="margin-top:28px"><button class="btn pri" onclick="addP('${p.n}')">+ Add to squad</button></div>`}
const addP=n=>{const p=pool.find(x=>x.n===n);squad.push({n:p.n,p:p.p,a:p.a,ca:p.ca,pa:p.pa,c:2052+Math.ceil(p.left/12),v:p.v,w:p.w,at:squad[0].at});go('squad');r()};
const tg=k=>{on=on.includes(k)?on.filter(x=>x!==k):[...on,k];shortlist()};
const rm=()=>{squad.splice(sel,1);sel=0;r()};
const swap=n=>{const c=cands.find(x=>x.n===n),o=squad[sel];Object.assign(o,{n:c.n,a:c.a,ca:c.ca,pa:c.pa,c:c.c,v:c.v,w:c.w,at:c.at});go('squad');r()};
const UPS=["Reading file","Decompressing","Parsing players","Building your squad"];
let up={f:null,st:-1,err:''};
const sz=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(0)+' MB';
function upView(){const u=up;let h=`<h2>Load your save</h2><div class="sub">Football Manager 2024 · processed on this device, nothing is uploaded.</div>`;
 if(!u.f)h+=`<label class="dz" id="dz" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();pickF(event.dataTransfer.files[0])"><b>Drop your .fm save here</b><span>or click to choose a file</span><input type="file" accept=".fm" hidden onchange="pickF(this.files[0])"></label>${u.err?`<div class="err">${u.err}</div>`:''}`;
 else{h+=`<div class="fi"><b>${u.f.name}</b><span>${sz(u.f.size)}</span></div><div class="stp">${UPS.map((x,i)=>`<div class="${i<u.st?'done':i===u.st?'on':''}"><i>${i<u.st?'✓':''}</i>${x}</div>`).join('')}</div>
  <div class="pb"><i style="width:${Math.min(100,u.st/UPS.length*100)}%"></i></div>`;
  if(u.st>=UPS.length)h+=`<div class="sm"><div>Club<b>Meong Racun</b></div><div>Season<b>2052</b></div><div>Players found<b>13,284</b></div></div><button class="btn pri" onclick="go('squad')">Open squad</button> <button class="btn" onclick="up={f:null,st:-1,err:''};upView()">Choose another</button>`}
 $('#upload').innerHTML=h}
function pickF(f){if(!f)return;if(!/\.fm$/i.test(f.name)){up={f:null,st:-1,err:'That is not a .fm save file. Pick a Football Manager save.'};return upView()}
 up={f,st:0,err:''};upView();const t=()=>setTimeout(()=>{up.st++;upView();if(up.st<UPS.length)t()},900);t()}
addEventListener('hashchange',()=>go(location.hash.slice(2)||'upload'));
r();go(location.hash.slice(2)||'upload');
</script></body></html>
